backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "destaque"
    label: "Destaque da Home"
    files:
      - name: "principal"
        label: "Manchete e Laterais"
        file: "content/destaque.json"
        fields:
          - label: "Manchete Principal"
            name: "manchete"
            widget: "object"
            fields:
              - { label: "Categoria", name: "categoria", widget: "select", options: ["Brasileirão", "Copa do Brasil", "Mercado da Bola", "Europa", "Amistosos"] }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Resumo", name: "resumo", widget: "text" }
              - { label: "Competição/Rodada", name: "competicao", widget: "string" }
              - { label: "Quando", name: "tempo", widget: "string", default: "Hoje" }
          - label: "Destaques Laterais"
            name: "laterais"
            widget: "list"
            summary: "{{titulo}}"
            fields:
              - { label: "Categoria", name: "categoria", widget: "select", options: ["Brasileirão", "Copa do Brasil", "Mercado da Bola", "Europa", "Amistosos"] }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Quando", name: "tempo", widget: "string", default: "Hoje" }

  - name: "noticias"
