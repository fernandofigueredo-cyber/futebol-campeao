media:
  input: images
  output: /images

content:
  - name: noticias
    label: Notícias
    path: content/noticias.json
    type: file
    fields:
      - name: items
        label: Lista
        type: object
        list: true
        fields:
          - name: sport
            label: Esporte
            type: string
          - name: titulo
            label: Título
            type: string
          - name: resumo
            label: Resumo
            type: text
          - name: tempo
            label: Tempo
            type: string
          - name: imagem
            label: Imagem
            type: image
