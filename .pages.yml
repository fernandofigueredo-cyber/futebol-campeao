media:
  input: images
  output: /images

content:
  - name: noticias
    label: Notícias
    path: content/noticias.json
    type: file
    fields:
      - name: items
        label: Lista
        type: object
        list: true
        fields:
          - name: sport
            label: Esporte
            type: string
          - name: titulo
            label: Título
            type: string
          - name: resumo
            label: Resumo
            type: text
          - name: tempo
            label: Tempo
            type: string
          - name: imagem
            label: Imagem
            type: image

  - name: destaque
    label: Destaque da Home
    path: content/destaque.json
    type: file
    fields:
      - name: manchete
        label: Manchete
        type: object
        fields:
          - name: categoria
            label: Categoria
            type: string
          - name: titulo
            label: Título
            type: string
          - name: resumo
            label: Resumo
            type: text
          - name: competicao
            label: Competição
            type: string
          - name: tempo
            label: Tempo
            type: string
          - name: imagem
            label: Imagem de fundo
            type: image
      - name: laterais
        label: Notícias Laterais
        type: object
        list: true
        fields:
          - name: categoria
            label: Categoria
            type: string
          - name: titulo
            label: Título
            type: string
          - name: tempo
            label: Tempo
            type: string
